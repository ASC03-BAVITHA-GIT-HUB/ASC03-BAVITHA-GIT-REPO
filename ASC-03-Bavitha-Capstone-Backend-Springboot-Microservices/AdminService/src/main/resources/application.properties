spring.datasource.url= jdbc:sqlserver://localhost:1433;databaseName=HCMS;user=sa;password=sqlserver;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=sqlserver

spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.SQLServerDialect

spring.jpa.hibernate.ddl-auto = update

spring.jpa.show-sql = true

spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

server.port=8030
# application.properties
admin.auth.maxFailedAttempts=3
admin.auth.lockMinutes=30

spring.application.name=Admin-Service
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/